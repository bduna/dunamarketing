<!doctype html><meta charset="utf-8">
<style>#out{font:12.5px/1.6 monospace;padding:12px;background:#fff;position:relative;z-index:9}
iframe{position:fixed;left:-9999px;top:0;width:390px;height:900px;border:0}</style>
<body><div id="out">…</div>
<script>
var L=[];function line(s){L.push(s);document.getElementById('out').innerHTML=L.join('<br>');}
function ok(c,t){ line((c?'<span style="color:#070">PASS</span> ':'<span style="color:#b00">FAIL</span> ')+t); }
var sweeps=[], turns=0;
// the interview answers: note the AREA is deliberately wide, to prove the report-time re-sweep runs
var FIELDS={job_value:"about $14,000 on a replacement",area:"Santa Rosa and all of Sonoma County",
  what_you_do:"Tear-offs and full replacements",known_for:"We show up when we say",
  services_talk:"Replacements, repairs, storm damage",must_haves:"",
  page_notes:"WHAT THEY DO\nTear-offs and full roof replacements across Sonoma County."};
var RW={description:"Ridgeline Roofing handles tear-offs and replacements across Sonoma County.",
  services:["Roof replacement","Leak repair"],primary_category:"Roofing Contractor",secondary_categories:[]};
var f=document.createElement('iframe'); f.src="_probe.html?restart&metrics=off&v=rr1";
f.onload=function(){
  var d=f.contentDocument,w=f.contentWindow,real=w.fetch;
  w.fetch=function(u,o){
    if(String(u).indexOf("searchText")>=0){ try{ sweeps.push(JSON.parse(o.body).textQuery); }catch(e){} }
    if(String(u).indexOf("script.google.com")>=0){
      var b={}; try{b=JSON.parse(o.body);}catch(e){}
      if(b.action!=="chat") return Promise.resolve(new w.Response('{"ok":true,"lead_id":"L"}',{status:200}));
      if(!b.messages) return Promise.resolve(new w.Response('{"ok":false,"error":"no messages"}',{status:200}));
      var last=b.messages[b.messages.length-1].content;
      if(last.indexOf("#REWRITE")===0) return Promise.resolve(new w.Response(JSON.stringify({ok:true,reply:JSON.stringify(RW),done:false}),{status:200}));
      if(last.indexOf("#ANALYSIS")===0) return Promise.resolve(new w.Response(JSON.stringify({ok:true,reply:"x",done:false}),{status:200}));
      turns++;
      if(turns>5) return Promise.resolve(new w.Response(JSON.stringify({ok:true,reply:"Done.",done:true,fields:FIELDS}),{status:200}));
      return Promise.resolve(new w.Response(JSON.stringify({ok:true,
        reply:'{"say":"","q":"Question '+turns+'?","type":"text","options":[],"other":false}',done:false,lead_id:"L"}),{status:200}));
    }
    return real.apply(w,arguments);
  };
  function type(t){var i=d.getElementById('input');i.value=t;
    i.dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('send').click();}
  setTimeout(function(){ var gq=d.getElementById('gq'); gq.value="Ridgeline Roofing, Windsor CA";
    gq.dispatchEvent(new w.Event('input',{bubbles:true})); },900);
  setTimeout(function(){ var r=d.querySelectorAll('#glist button'); if(r.length) r[0].click(); },4200);
  setTimeout(function(){ var y=d.querySelector('.cbtn.yes'); if(y) y.click(); },8500);
  setTimeout(function(){ var b=d.querySelector('.confirm.trade'); if(b) b.querySelectorAll('.cbtn')[0].click(); },11500);
  [13500,15000,16500,18000,19500].forEach(function(t,i){ setTimeout(function(){ type("answer "+(i+1)); },t); });
  setTimeout(function(){
    line("sweep queries: <b>"+sweeps.join("</b> | <b>")+"</b>");
    ok(sweeps.length>=2,"the report ran its own second sweep ("+sweeps.length+" total)");
    ok(sweeps.every(function(q){return /roofing contractor/i.test(q);}),"BOTH sweeps use the trade query");
    ok(/Sonoma County/i.test(sweeps[sweeps.length-1]||""),"the report sweep used the area they typed");
    var st=null; try{ st=JSON.parse(w.localStorage.getItem("duna_chat")||"null"); }catch(e){}
    var c=(st&&st.competitors)||[];
    line("competitors after the report sweep: "+c.map(function(x){return x.name+" ("+(x.miles==null?"?":Math.round(x.miles))+"mi)";}).join(" | "));
    ok(c.length>0 && c.every(function(x){return /roof/i.test(x.name);}),"all named for the trade");
    ok(c.every(function(x){return x.miles==null||x.miles<=50;}),"all inside the distance cap");
    var rows=[].slice.call(d.querySelectorAll('table.sb tbody tr:not(.me) td.bn')).map(function(x){return x.textContent.trim();});
    line("scoreboard: "+rows.join(" | "));
    ok(rows.length>0 && rows.every(function(n){return /roof/i.test(n);}),"the SCOREBOARD shows only roofing companies");
    ok(/roofing companies within about 25 miles/i.test(d.body.innerText),"caption states the trade and radius");
    ok(!w.__err,"no JS error"+(w.__err?" — "+w.__err:""));
  },34000);
};
document.body.appendChild(f);
</script>
