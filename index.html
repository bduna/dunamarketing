<style>
  :root {
    --ground: #050a18;
    --ink: #f3f5fa;
    --veil: 5 10 24;
    --gutter: clamp(20px, 6vw, 104px);
    --ease-out: cubic-bezier(.16, .8, .2, 1);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Full-bleed layers: fixed to the viewport so they run edge to edge on every screen */
  .wall, .veil, .fallback { position: fixed; inset: 0; width: 100%; height: 100%; }
  .wall { display: block; }
  .veil {
    pointer-events: none;
    background:
      linear-gradient(180deg, rgb(var(--veil) / .95) 0%, rgb(var(--veil) / .8) 22%, rgb(var(--veil) / .4) 42%, rgb(var(--veil) / 0) 60%),
      radial-gradient(85% 70% at 0% 0%, rgb(var(--veil) / .75) 0%, rgb(var(--veil) / 0) 72%),
      linear-gradient(90deg, rgb(var(--veil) / .5) 0%, rgb(var(--veil) / 0) 28%),
      linear-gradient(0deg, rgb(var(--veil) / .4) 0%, rgb(var(--veil) / 0) 16%);
  }

  .copy {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 2;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: clamp(26px, 6.5vh, 76px);
    padding-top: calc(env(safe-area-inset-top, 0px) + clamp(24px, 7.5vh, 96px));
    padding-left: calc(env(safe-area-inset-left, 0px) + var(--gutter));
    padding-right: calc(env(safe-area-inset-right, 0px) + var(--gutter));
    pointer-events: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: .5em;
    font-size: clamp(19px, 1.1vw + 11px, 30px);
    font-weight: 800;
    letter-spacing: -.012em;
    animation: rise 1s var(--ease-out) both;
  }
  .brand img { width: 1.6em; height: auto; filter: invert(1); }
  .headline {
    margin: 0;
    max-width: 15.5em;
    font-size: clamp(2.55rem, 4.6vw + 1.6vh, 7.4rem);
    font-weight: 640;
    font-stretch: 108%;
    line-height: 1;
    letter-spacing: -.03em;
    text-wrap: balance;
    text-shadow: 0 .04em .5em rgb(var(--veil) / .55);
  }
  .headline > span { display: block; animation: rise 1.15s var(--ease-out) .1s both; }
  .headline > span + span { animation-delay: .22s; }
  @keyframes rise { from { opacity: .15; transform: translateY(.45em); } }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Static tilted grid for browsers without WebGL2 */
  .fallback { display: none; overflow: hidden; perspective: 2400px; }
  .no-gl .fallback { display: block; }
  .no-gl .wall { display: none; }
  .fallback-plane {
    position: absolute; left: 58%; top: 62%;
    display: grid;
    grid-template-columns: repeat(6, 30vmax);
    gap: 2.2vmax;
    transform: translate(-50%, -50%) rotateX(45deg) rotateZ(18deg);
  }
  .fallback-plane div {
    aspect-ratio: 4 / 3;
    border-radius: 1.3vmax;
    background: center top / 100% auto no-repeat;
    box-shadow: 0 2vmax 4vmax rgb(0 0 0 / .5);
  }

  /* Phones: tighter top block, and a headline small enough that each line holds together.
     The gap is the headline's air — the brand sits above it and the button below, so this one
     value opens both sides. Desktop keeps its own clamp and is untouched. */
  @media (max-width: 760px) {
    .copy { padding-top: calc(env(safe-area-inset-top, 0px) + 22px); gap: 30px; }
    .headline { font-size: min(8.5vw, 2.55rem); }
  }

  /* The one way off the splash and into the site. .copy ignores the pointer, so this takes it back.
     The wall behind it is photographic and moving, so the fill carries the contrast rather than the
     backdrop: at 0.72 the ground still wins over the brightest card that can pass under it, which is
     a near-white screenshot, and white text holds about 8:1 at that floor. The border is what makes
     it a control; the shape, height, weight and press come from the site's own buttons.
     It stays under the headline in the only way that matters here, which is size. */
  .enter {
    pointer-events: auto;
    align-self: start;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 0 24px;
    border: 1.5px solid rgb(255 255 255 / .9);
    border-radius: 6px;
    background: rgb(var(--veil) / .72);
    color: var(--ink);
    font-size: clamp(15px, .2vw + 14px, 17px);
    font-weight: 650;
    line-height: 1.1;
    letter-spacing: -.004em;
    text-decoration: none;
    box-shadow: 0 14px 34px rgb(var(--veil) / .55);
    transition: background-color .2s var(--ease-out), border-color .2s var(--ease-out), transform .15s var(--ease-out);
    animation: rise 1.2s var(--ease-out) .34s both;
  }
  .enter svg { width: 19px; height: 19px; flex: none; transition: transform .25s var(--ease-out); }
  .enter:hover { background: rgb(var(--veil) / .88); border-color: #fff; }
  .enter:hover svg, .enter:focus-visible svg { transform: translateX(.22em); }
  .enter:active { transform: translateY(1px); }
  .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .brand, .headline > span, .enter { animation: none; }
    .enter, .enter svg { transition: none; }
  }
</style>

<script>
(() => {

  // redeploy does not invalidate them, in two sizes because a phone was downloading the 960 set

  const WALL = "/assets/img/wall/";
  const SHOTS = [
    {n:"Long Table Catering",u:"https://dunamarketing.com/portfolio/long-table-catering/",b:"long-table-catering-960-e0ddf8aa.webp",s:"long-table-catering-640-9596008c.webp"},

    {n:"Bright Beginnings Preschool",u:"https://dunamarketing.com/portfolio/bright-beginnings-preschool/",b:"bright-beginnings-preschool-960-c973d11a.webp",s:"bright-beginnings-preschool-640-6dc5877d.webp"},
    {n:"Waggin’ Tails Grooming",u:"https://dunamarketing.com/portfolio/waggin-tails-grooming/",b:"waggin-tails-grooming-960-e6ee4fef.webp",s:"waggin-tails-grooming-640-4670c833.webp"},
    {n:"Summit Ridge Ski & Board",u:"https://dunamarketing.com/portfolio/summit-ridge-ski-board/",b:"summit-ridge-ski-board-960-712afc89.webp",s:"summit-ridge-ski-board-640-25005a59.webp"},
    {n:"Maple Street Cleaners",u:"https://dunamarketing.com/portfolio/maple-street-cleaners/",b:"maple-street-cleaners-960-08b43c4c.webp",s:"maple-street-cleaners-640-cdc1aa0c.webp"}
  ];
  // How wide a card is drawn, in CSS px. layout() and the texture choice have to agree on this,
  // so it is written once.
  const cardWidth = (vw, vh) => {
    const boost = 1 + 0.5 * Math.min(1, Math.max(0, (760 - vw) / 380));
    return Math.min(640, Math.max(200, (0.21 * vw + 0.16 * vh) * boost));
  };
  // Which set to fetch. The old rule was max(w, h) x dpr >= 1500 — a proxy for "big screen" that
  // missed in both directions: a Pixel scores 1830 and pulled the 960 set for a card it draws 679
  // device px wide, while a 1920x1080 desktop draws 576 and also pulled 960. Size the choice on
  // the card, since the card is what gets sampled. Reduced to the size actually drawn, the two
  // sets differ by under 4.3/255, so 640 carries anything up to about 720.
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const BIG = cardWidth(innerWidth, innerHeight) * DPR > 720;
  const TW = BIG ? 960 : 640, TH = BIG ? 2400 : 1600;
  const shotSrc = s => WALL + (BIG ? s.b : s.s);
  const root = document.documentElement;
  const canvas = document.getElementById('wall');
  document.getElementById('sites').textContent =
    `Ten sample websites drift across the background: ${SHOTS.map(s => s.n).join(', ')}.`;

  const DEG = Math.PI / 180;
  const BASE_THETA = 18 * DEG;   // turn of the plane
  const BASE_PHI = 45 * DEG;     // tilt away from the viewer
  const INTRO_MS = 2200;
  const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');

  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, powerPreference: 'high-performance' });
  if (!gl || !SHOTS.length) { fallback(); return; }

  const VS = `#version 300 es
  precision highp float;
  layout(location = 0) in vec2 aCorner;
  layout(location = 1) in vec4 aInst;              // row, slot, layer, seed
  uniform vec2 uView, uOrigin, uAnchor, uAng, uCard;
  uniform vec4 uGrid;                                // pitch, rowPitch, span, uStart
  uniform float uP, uDrift, uTime, uLift, uFrac, uPass, uCycle, uHold;
  out vec2 vUv, vSize;
  out vec3 vTex;
  out float vBob;
  float hash(float n) { return fract(sin(n * 12.9898 + 7.13) * 43758.5453); }
  void main() {
    float row = aInst.x, slot = aInst.y, seed = aInst.w;
    float dir = mod(row, 2.0) < 0.5 ? -1.0 : 1.0;
    float u = uGrid.w + mod(slot * uGrid.x + dir * uDrift + hash(row) * uGrid.x, uGrid.z);
    float v = row * uGrid.y;
    float bob = 0.5 + 0.5 * sin(uTime * 0.95 + seed * 6.2832);
    float lift = uLift * (0.7 + 0.6 * bob);
    vec2 size = uCard, offs = vec2(0.0);
    float z = lift;
    if (uPass < 0.5) { size *= vec2(1.16, 1.2); offs = vec2(0.0, 0.05 * uCard.y + lift * 0.6); z = 0.0; }
    vec2 p = vec2(u, v) + offs + aCorner * size;
    float ct = cos(uAng.x), st = sin(uAng.x), cp = cos(uAng.y), sp = sin(uAng.y);
    float a = p.x * ct - p.y * st, b = p.x * st + p.y * ct;
    vec3 w = vec3(a, b * cp, b * sp) + vec3(0.0, -sp, cp) * z;
    w.xy += uAnchor - uOrigin;
    float k = uP / (uP - w.z);
    vec2 s = uOrigin + w.xy * k;
    gl_Position = vec4(vec2(s.x / uView.x * 2.0 - 1.0, 1.0 - s.y / uView.y * 2.0) / k, 0.0, 1.0 / k);
    vUv = aCorner + 0.5;
    vSize = size;
    vBob = bob;
    // A beat on the hero, then near-continuous travel down and back. uHold is where the beat
    // ends; the rest of the window is measured as fractions of it so the return always lands on
    // the end of the cycle — a flat tail there would just be more time spent at the top.
    float c = fract(uTime / uCycle + seed);
    float m = 1.0 - uHold;
    float scroll = (1.0 - uFrac) * 0.97 *
      (0.45 * smoothstep(uHold, uHold + 0.26 * m, c)
     + 0.55 * smoothstep(uHold + 0.34 * m, uHold + 0.60 * m, c)
     -        smoothstep(uHold + 0.68 * m, uHold + m, c));
    vTex = vec3(vUv.x, scroll + vUv.y * uFrac, aInst.z);
  }`;

  const FS = `#version 300 es
  precision highp float;
  precision highp sampler2DArray;
  uniform sampler2DArray uTex;
  uniform vec2 uCard;
  uniform float uPass, uAlpha, uRadius;
  in vec2 vUv, vSize;
  in vec3 vTex;
  in float vBob;
  out vec4 outColor;
  float roundRect(vec2 p, vec2 halfSize, float r) {
    vec2 q = abs(p) - halfSize + r;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
  }
  void main() {
    vec2 p = (vUv - 0.5) * vSize;
    if (uPass < 0.5) {
      float blur = uCard.x * (0.045 + 0.03 * vBob);
      float d = roundRect(p, uCard * 0.5, uRadius);
      float a = (1.0 - smoothstep(-blur, blur, d)) * (0.62 - 0.2 * vBob) * uAlpha;
      outColor = vec4(0.0, 0.0, 0.0, a);
      return;
    }
    float d = roundRect(p, vSize * 0.5, uRadius);
    float aa = max(fwidth(d), 1e-4);
    float a = clamp(0.5 - d / aa, 0.0, 1.0) * uAlpha;
    vec3 col = texture(uTex, vTex).rgb;
    col *= 1.04 - 0.16 * vUv.y - 0.05 * vUv.x;
    col += smoothstep(-1.5 * aa, 0.0, d) * 0.08;
    outColor = vec4(col * a, a);
  }`;

  let prog, vao, instBuf, tex, U = {}, count = 0, ready = false, raf = 0;
  let L = null, images = [];
  let pointer = { tx: 0, ty: 0, x: 0, y: 0 };
  let clock = 3.2, last = performance.now(), introStart = 0;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }

  function initGL() {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    for (const name of ['uView', 'uOrigin', 'uAnchor', 'uAng', 'uCard', 'uGrid', 'uP', 'uDrift', 'uTime',
      'uLift', 'uFrac', 'uPass', 'uTex', 'uAlpha', 'uRadius', 'uCycle', 'uHold']) U[name] = gl.getUniformLocation(prog, name);

    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5, -.5, .5, -.5, -.5, .5, .5, .5]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    instBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(1, 1);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  }

  function uploadTextures() {
    const tw = TW, th = TH;
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, Math.floor(Math.log2(th)) + 1, gl.RGBA8, tw, th, images.length);
    images.forEach((img, i) => {
      let src = img;
      if (img.naturalWidth !== tw || img.naturalHeight !== th) {
        src = document.createElement('canvas');
        src.width = tw; src.height = th;
        src.getContext('2d').drawImage(img, 0, 0, tw, th);
      }
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, tw, th, 1, gl.RGBA, gl.UNSIGNED_BYTE, src);
    });
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
    if (aniso) gl.texParameterf(gl.TEXTURE_2D_ARRAY, aniso.TEXTURE_MAX_ANISOTROPY_EXT,
      Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  }

  // Where a screen point lands on the tilted plane (inverse of the vertex shader projection)
  function toPlane(sx, sy, theta, phi) {
    const cp = Math.cos(phi), sp = Math.sin(phi), ct = Math.cos(theta), st = Math.sin(theta);
    const dx = sx - L.origin[0], dy = sy - L.origin[1];
    const ax = L.anchor[0] - L.origin[0], ay = L.anchor[1] - L.origin[1];
    const b = L.P * (dy - ay) / Math.max(L.P * cp + dy * sp, 1e-3);
    const a = dx * (L.P - b * sp) / L.P - ax;
    return [a * ct + b * st, -a * st + b * ct];
  }

  function layout() {
    const vw = canvas.clientWidth || innerWidth, vh = canvas.clientHeight || innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);

    const portrait = vh > vw;
    // One screenshot's scroll, the same on every screen: it holds at the top, then travels down
    // and back. These are the two numbers to tune. uTime has to wrap on a whole number of cycles
    // or the scroll jumps, so the wrap is derived from the cycle rather than fixed — 12.5 did not
    // divide the 1080 that was once hardcoded there, and neither does this.
    const PAUSE = 2.5, TRAVEL = 10;   // seconds
    const cycle = PAUSE + TRAVEL;
    const W = cardWidth(vw, vh);
    const H = W * 0.75, G = W * 0.075;
    L = {
      vw, vh, W, H, pitch: W + G, rowPitch: H + G,
      radius: W * 0.045, lift: W * 0.05,
      // Lateral drift of the cards. A desktop shows far more of the plane at once, so the same
      // travel reads slower there than on a phone; it gets a faster rate above 760px, the same
      // line the phone media query uses. Cards only — the page-scroll runs off uTime, untouched.
      speed: W * (vw > 760 ? 0.17 : 0.13),
      cycle, hold: PAUSE / cycle, wrap: cycle * Math.round(1080 / cycle),
      P: 2.1 * vh + 0.7 * vw,
      origin: [vw * 0.5, vh * (portrait ? 0.42 : 0.38)],
      anchor: [vw * (portrait ? 0.56 : 0.6), vh * (portrait ? 0.64 : 0.6)],
    };

    // Cover the viewport for every angle the intro and pointer tilt can reach
    let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
    for (const [dt, dp] of [[0, 0], [2.5, 3], [-2.5, -3], [2.5, -3], [-2.5, 3], [-6, 14]]) {
      for (const [sx, sy] of [[0, 0], [vw, 0], [0, vh], [vw, vh]]) {
        const [u, v] = toPlane(sx, sy, BASE_THETA + dt * DEG, BASE_PHI + dp * DEG);
        uMin = Math.min(uMin, u); uMax = Math.max(uMax, u);
        vMin = Math.min(vMin, v); vMax = Math.max(vMax, v);
      }
    }
    uMin -= L.pitch * 1.5; uMax += L.pitch * 1.5;
    const rMin = Math.floor((vMin - L.rowPitch) / L.rowPitch), rMax = Math.ceil((vMax + L.rowPitch) / L.rowPitch);
    let perRow = Math.ceil((uMax - uMin) / L.pitch) + 1;
    if (perRow % SHOTS.length === 1) perRow++;
    L.span = perRow * L.pitch;
    L.uStart = uMin;

    const data = [];
    for (let r = rMin; r <= rMax; r++) {
      for (let s = 0; s < perRow; s++) {
        const layer = (((s * 3 + r * 7) % SHOTS.length) + SHOTS.length) % SHOTS.length;
        data.push(r, s, layer, Math.random());
      }
    }
    count = data.length / 4;
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  }

  function draw(theta, phi, alpha) {
    gl.clearColor(5 / 255, 10 / 255, 24 / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (!ready || !L) return;
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
    gl.uniform1i(U.uTex, 0);
    gl.uniform2f(U.uView, L.vw, L.vh);
    gl.uniform2f(U.uOrigin, L.origin[0], L.origin[1]);
    gl.uniform2f(U.uAnchor, L.anchor[0], L.anchor[1]);
    gl.uniform2f(U.uAng, theta, phi);
    gl.uniform2f(U.uCard, L.W, L.H);
    gl.uniform4f(U.uGrid, L.pitch, L.rowPitch, L.span, L.uStart);
    gl.uniform1f(U.uP, L.P);
    gl.uniform1f(U.uDrift, (L.speed * clock) % L.span);
    gl.uniform1f(U.uTime, clock % L.wrap);   // a whole number of scroll cycles, so the loop never jumps
    gl.uniform1f(U.uCycle, L.cycle);
    gl.uniform1f(U.uHold, L.hold);
    gl.uniform1f(U.uLift, L.lift);
    gl.uniform1f(U.uFrac, (L.H / L.W) * 0.4);   // card aspect x screenshot aspect (1440 / 3600)
    gl.uniform1f(U.uRadius, L.radius);
    gl.uniform1f(U.uAlpha, alpha);
    gl.uniform1f(U.uPass, 0);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    gl.uniform1f(U.uPass, 1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  }

  function frame(now) {
    const still = reduceMq.matches;
    const dt = Math.min(64, now - last);
    last = now;
    if (!still) clock += dt / 1000;
    const t = still ? 1 : Math.min(1, (now - introStart) / INTRO_MS);
    const e = 1 - Math.pow(1 - t, 3);
    if (!still) {
      pointer.x += (pointer.tx - pointer.x) * 0.045;
      pointer.y += (pointer.ty - pointer.y) * 0.045;
    }
    const theta = BASE_THETA + (pointer.x * 2.2 - (1 - e) * 6) * DEG;
    const phi = BASE_PHI + (-pointer.y * 2.6 + (1 - e) * 14) * DEG;
    draw(theta, phi, e);
    raf = still ? 0 : requestAnimationFrame(frame);
  }

  function start() {
    cancelAnimationFrame(raf);
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function fallback() {
    root.classList.add('no-gl');
    const plane = document.querySelector('.fallback-plane');
    for (let i = 0; i < 36 && SHOTS.length; i++) {
      const tile = document.createElement('div');
      tile.style.backgroundImage = `url("${shotSrc(SHOTS[(i * 3) % SHOTS.length])}")`;
      plane.appendChild(tile);
    }
  }

  async function boot() {
    try {
      initGL();
      layout();
      start();
      const loaded = await Promise.all(SHOTS.map(s => {
        const img = new Image();
        img.decoding = "async";
        img.src = shotSrc(s);
        // A data URI could not fail. A request can, and one bad response must not cost the
        // whole wall, so a failure resolves to null instead of rejecting the batch.
        return img.decode().then(() => img, () => null);
      }));
      const ok = loaded.find(Boolean);
      if (!ok) return;                        // nothing to draw; the headline and button are the page
      images = loaded.map(img => img || ok);  // a gap borrows a neighbour rather than going black
      uploadTextures();
      ready = true;
      introStart = performance.now();
      start();
    } catch (err) {
      console.error(err);
      cancelAnimationFrame(raf);
      fallback();
    }
  }

  addEventListener('pointermove', e => {
    pointer.tx = (e.clientX / innerWidth) * 2 - 1;
    pointer.ty = (e.clientY / innerHeight) * 2 - 1;
  }, { passive: true });
  root.addEventListener('pointerleave', () => { pointer.tx = 0; pointer.ty = 0; });

  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (prog) { layout(); start(); } }, 120);
  });
  reduceMq.addEventListener('change', start);

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); ready = false; });
  canvas.addEventListener('webglcontextrestored', () => {
    initGL(); layout(); uploadTextures(); ready = true; start();
  });

  boot();
})();
</script>
</body>
</html>
