<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duna Marketing &mdash; Find your Google Business Profile</title>
<meta name="description" content="Pick your Google Business Profile and see how it compares to the companies above you. No email or phone number required.">
<meta property="og:title" content="See why the same companies always sit above you on Google">
<meta property="og:description" content="Pick your listing and see how your profile compares — free, no email or phone number.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="duna_marketing_logo.png">
<link rel="apple-touch-icon" href="duna_marketing_logo.png">
<style>
  :root {
    --ink:#1a1d24; --muted:#5a6070; --line:#e2e5ea; --input-line:#8c9098;
    --navy:#003087; --navy-deep:#001d52; --navy-soft:#eaf0fb;
    --red:#C8102E; --bg:#f7f8fa;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:
      linear-gradient(to right, rgba(60,66,80,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(60,66,80,.06) 1px, transparent 1px);
    background-size:20px 20px; background-position:-1px -1px;
    color:var(--ink); line-height:1.5; min-height:100dvh;
    display:flex; flex-direction:column;
  }
  .topbar { display:flex; align-items:center; gap:10px;
    padding:10px 18px; background:var(--navy); border-bottom:3px solid var(--red); }
  .topbar img { width:26px; height:26px; object-fit:contain; background:#fff; border-radius:6px; padding:3px; }
  .topbar .name { color:#fff; font-weight:800; letter-spacing:.01em; }

  main { flex:1; display:flex; justify-content:center; padding:0 20px; }
  .wrap { width:100%; max-width:560px; padding:clamp(36px, 11vh, 100px) 0 60px; }

  .kicker { margin:0 0 10px; text-align:center; color:var(--red); font-weight:800;
    font-size:.78rem; letter-spacing:.09em; text-transform:uppercase; }
  h1 { margin:0 0 8px; text-align:center; font-size:clamp(1.5rem, 6vw, 2.1rem); line-height:1.15;
    letter-spacing:-.02em; color:var(--navy); }
  .sub { margin:0 0 26px; text-align:center; color:var(--muted); font-size:1rem; }

  /* The field is the page. Everything above it is a label for it. */
  .field { position:relative; }
  .field input { width:100%; font:inherit; font-size:1.05rem; padding:16px 18px;
    border:1px solid var(--input-line); border-radius:14px; background:#fff; color:var(--ink); }
  .field input::placeholder { color:var(--muted); }
  .field input:focus { outline:2px solid transparent;
    border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,48,135,.16); }
  .field input:disabled { background:#f1f3f7; color:var(--muted); }

  .glist { position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:5;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 14px 34px rgba(20,28,48,.16); }
  .glist[hidden] { display:none; }
  .glist button { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    font:inherit; padding:13px 15px; background:#fff; border:0; border-top:1px solid var(--line);
    cursor:pointer; color:var(--ink); }
  .glist button:first-child { border-top:0; }
  .glist button:hover, .glist button:focus-visible, .glist button.on { background:var(--navy-soft); outline:none; }
  .glist .pin { width:19px; height:19px; flex:0 0 auto; color:var(--navy); }
  .glist .txt { min-width:0; }
  .glist strong { display:block; font-size:.98rem; font-weight:700; }
  .glist small { display:block; color:var(--muted); font-size:.85rem; }

  .note { margin:14px 0 0; text-align:center; color:var(--muted); font-size:.85rem; }
  .note[hidden] { display:none; }
  .busy { margin:16px 0 0; text-align:center; color:var(--navy); font-weight:700; font-size:.95rem; }
  .busy[hidden] { display:none; }
</style>
</head>
<body>
<header class="topbar">
  <img src="duna_marketing_logo.png" alt="">
  <span class="name">Duna Marketing</span>
</header>

<main>
  <div class="wrap">
    <p class="kicker">No email or phone number required</p>
    <h1>Find your Google Business Profile</h1>
    <p class="sub">Start typing your business name and pick it from the list.</p>

    <div class="field">
      <input id="gq" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="search"
             placeholder="e.g. Ridgeline Roofing, Santa Rosa" aria-label="Business name and city">
      <div class="glist" id="glist" hidden role="listbox" aria-label="Matching businesses"></div>
    </div>

    <p class="note" id="note" hidden></p>
    <p class="busy" id="busy" hidden>Opening your report&hellip;</p>
  </div>
</main>

<script>
(function () {
  var GOOGLE_PLACES_KEY = "AIzaSyA_2Mzsy3s9aZo8OS4DBFY-OYhayl-F_tI";
  var LEADS_URL = "https://script.google.com/macros/s/AKfycbz5czvMKJWHN92D_kah_JbCLSgo4UknxG37zhEfZExFCcupdYur6phh2457sP5E8K_X/exec";
  var LEADS_SECRET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  var gq = document.getElementById("gq"),
      glist = document.getElementById("glist"),
      note = document.getElementById("note"),
      busy = document.getElementById("busy");
  var timer = null, lastQ = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  // Apps Script tears its container down when idle, and the first call after that pays the rebuild.
  // The report page needs the relay seconds from now, so knock on the door while they are typing.
  var warmed = false;
  function warmRelay() {
    if (warmed) return;
    warmed = true;
    try {
      fetch(LEADS_URL, {
        method: "POST", mode: "cors", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ secret: LEADS_SECRET, action: "chat" })
      }).catch(function () {});
    } catch (e) {}
  }

  function search(v) {
    return fetch("https://places.googleapis.com/v1/places:autocomplete", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Goog-Api-Key": GOOGLE_PLACES_KEY },
      body: JSON.stringify({ input: v, includedRegionCodes: ["us"] })
    }).then(function (r) { return r.json(); }).then(function (j) {
      return (j.suggestions || []).filter(function (s) { return s.placePrediction; }).slice(0, 5)
        .map(function (s) {
          var p = s.placePrediction;
          return {
            id: p.placeId,
            main: (p.structuredFormat && p.structuredFormat.mainText && p.structuredFormat.mainText.text) || p.text.text,
            sec: (p.structuredFormat && p.structuredFormat.secondaryText && p.structuredFormat.secondaryText.text) || ""
          };
        });
    });
  }

  // The pick is handed over in storage rather than a query string: a place_id in a URL is the kind
  // of thing people paste to each other, and a shared link would run a report on someone else.
  function choose(id, name) {
    glist.hidden = true;
    note.hidden = true;
    busy.hidden = false;
    gq.disabled = true;
    try { localStorage.setItem("duna_pick", JSON.stringify({ place_id: id, name: name, at: Date.now() })); } catch (e) {}
    setTimeout(function () { location.href = "report.html"; }, 200);
  }

  function draw(items) {
    if (!items.length) {
      glist.hidden = true;
      note.hidden = false;
      note.textContent = "Nothing matching that yet — try the business name and the town.";
      return;
    }
    glist.innerHTML = items.map(function (it) {
      return '<button type="button" role="option" data-id="' + esc(it.id) + '">' +
        '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
        '<span class="txt"><strong>' + esc(it.main) + '</strong>' +
        (it.sec ? '<small>' + esc(it.sec) + '</small>' : "") + '</span></button>';
    }).join("");
    glist.hidden = false;
    note.hidden = true;
    cursor = -1;
    [].forEach.call(glist.querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        choose(b.getAttribute("data-id"), b.querySelector("strong").textContent);
      });
    });
  }

  gq.addEventListener("input", function () {
    warmRelay();
    clearTimeout(timer);
    var v = gq.value.trim();
    if (v.length < 3) { glist.hidden = true; note.hidden = true; return; }
    timer = setTimeout(function () {
      if (v === lastQ) return;
      lastQ = v;
      search(v).then(draw).catch(function () { glist.hidden = true; });
    }, 220);
  });

  // Down and up walk the list, Enter takes what is highlighted — and on a phone the keyboard's
  // search key takes the first match rather than doing nothing.
  var cursor = -1;
  function highlight(i) {
    var opts = glist.querySelectorAll("button");
    if (!opts.length) return;
    cursor = (i + opts.length) % opts.length;
    [].forEach.call(opts, function (b, n) { b.classList.toggle("on", n === cursor); });
    opts[cursor].scrollIntoView({ block: "nearest" });
  }
  gq.addEventListener("keydown", function (e) {
    if (glist.hidden) { if (e.key === "Enter") e.preventDefault(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); highlight(cursor + 1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); highlight(cursor - 1); return; }
    if (e.key === "Escape") { glist.hidden = true; cursor = -1; return; }
    if (e.key !== "Enter") return;
    e.preventDefault();
    var opts = glist.querySelectorAll("button");
    var b = opts[cursor >= 0 ? cursor : 0];
    if (b) b.click();
  });
  // A tap outside closes it, the way every other dropdown behaves.
  document.addEventListener("click", function (e) {
    if (!glist.hidden && !glist.contains(e.target) && e.target !== gq) glist.hidden = true;
  });

  setTimeout(function () { try { gq.focus({ preventScroll: true }); } catch (e) {} }, 60);
})();
</script>
</body>
</html>
